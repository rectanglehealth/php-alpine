name: Build and release PHP-FPM image

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version to build and release
        required: true
        type: choice
        default: 8.5.12
        options:
          - 8.2.35
          - 8.3.36
          - 8.4.27
          - 8.5.12
      runner:
        description: X86 runner size (16-core requires a configured larger runner)
        required: true
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - ubuntu-latest-16-cores

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Both choices are x86_64. The standard runner is always the safe default;
    # the larger-runner choice requires organization-level availability.
    runs-on: ${{ inputs.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Select PHP build configuration
        id: config
        shell: bash
        env:
          SELECTED_VERSION: ${{ inputs.php_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          case "$SELECTED_VERSION" in
            8.2.35)
              series=8.2
              sha256=5737b98601fe5ab1b8c5db0c82ed3158acb9283ed3081ffe2faffb9ac81455e6
              gpg_keys='39B641343D8C104B2B146DC3F9C39DC0B9698544 E60913E4DF209907D8E30D96659A97C9CF2A795A 1198C0117593497A5EC5C199286AF1F9897469DC'
              ;;
            8.3.36)
              series=8.3
              sha256=dd54693aa334c5c4d72e9aee96b082c2473750a18a6c1d105789c93a3b1692fd
              gpg_keys='1198C0117593497A5EC5C199286AF1F9897469DC C28D937575603EB4ABB725861C0779DC5C0A9DE4 AFD8691FDAEDF03BDF6E460563F15A9B715376CA'
              ;;
            8.4.27)
              series=8.4
              sha256=dcf93923b0e38e0d5252b25b796520b5a47761a08b3488b6d0b5d1115764d3f0
              gpg_keys='AFD8691FDAEDF03BDF6E460563F15A9B715376CA 9D7F99A0CB8F05C8A6958D6256A97AF7600A39A6 0616E93D95AF471243E26761770426E17EBBB3DD'
              ;;
            8.5.12)
              series=8.5
              sha256=08bc2eba2a588654ade1357174aa646b761556c862dda0678345ee29ed481209
              gpg_keys='1198C0117593497A5EC5C199286AF1F9897469DC 49D9AF6BC72A80D6691719C8AA23F5BE9C7097D4 D95C03BC702BE9515344AE3374E44BC9067701A5'
              ;;
            *)
              echo "Unsupported PHP version: $SELECTED_VERSION" >&2
              exit 1
              ;;
          esac

          image_name="${REPOSITORY,,}"
          {
            echo "version=$SELECTED_VERSION"
            echo "series=$series"
            echo "sha256=$sha256"
            echo "gpg_keys=$gpg_keys"
            echo "image=$REGISTRY/$image_name"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=php-${{ steps.config.outputs.version }}-amd64
          cache-to: type=gha,mode=max,scope=php-${{ steps.config.outputs.version }}-amd64
          build-args: |
            ALPINE_VERSION=3.24
            PHP_VERSION=${{ steps.config.outputs.version }}
            PHP_SERIES=${{ steps.config.outputs.series }}
            PHP_SHA256=${{ steps.config.outputs.sha256 }}
            PHP_GPG_KEYS=${{ steps.config.outputs.gpg_keys }}
          tags: |
            ${{ steps.config.outputs.image }}:${{ steps.config.outputs.version }}
            ${{ steps.config.outputs.image }}:${{ steps.config.outputs.series }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.config.outputs.version }}
